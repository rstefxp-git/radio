name: apk
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Projet Android
        run: |
          mkdir www
          cp radios.html www/index.html
          cp manifest.webmanifest sw.js icon-192.png icon-512.png www/
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Radios NC" io.github.rstefxp.radios --web-dir www
          npx cap add android
          npx cap sync android
          python3 patch.py
      - name: Compiler
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: radios-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
