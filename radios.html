<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radios NC</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#14161a">
<style>
:root{color-scheme:dark;--bg:#14161a;--card:#1d2127;--fg:#e9e7e2;--mut:#8d939c;--ac:#8ec5ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#main{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(16px + env(safe-area-inset-top)) 24px calc(16px + env(safe-area-inset-bottom));touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
#logo{width:min(56vw,46vh,260px);aspect-ratio:1;border-radius:24px;background:var(--card);display:grid;place-items:center;font-size:72px;font-weight:700;color:#fff;overflow:hidden}
#fn{color:var(--mut);font-size:15px;text-align:center;margin-top:-10px}
#nm{font-size:22px;font-weight:600;text-align:center;max-width:100%}
#sub{color:var(--mut);font-size:14px;min-height:20px;text-align:center}
#pp{width:84px;height:84px;border-radius:50%;border:2px solid var(--ac);color:var(--ac);display:grid;place-items:center;font-size:30px;margin-top:6px}
#hint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));color:var(--mut);font-size:12px;opacity:.7}
#menu{position:fixed;top:0;left:0;bottom:0;width:min(100vw,460px);z-index:30;background:var(--bg);overflow:auto;overscroll-behavior:contain;box-shadow:0 0 40px #000a;transition:transform .22s ease,visibility 0s}
#menu.out{transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
#mh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg);border-bottom:1px solid #262b32}
#mh h1{flex:1;font-size:17px;font-weight:600}
button{background:var(--card);border:1px solid #2c323a;color:var(--fg);padding:8px 12px;border-radius:6px;font:inherit;cursor:pointer}
button:hover{border-color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.st{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid #1d2127}
.st:hover{background:#191c21}
.st.on{background:#1d2733}
.st i{width:48px;height:48px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:15px;color:#fff;flex:none}
.st div{min-width:0}
.st b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st span{color:var(--mut);font-size:12px}
.empty{padding:24px 14px;color:var(--mut)}
</style>
</head>
<body>
<audio id="a" preload="none"></audio>

<div id="main">
  <div id="logo">♪</div>
  <div id="nm">Radios NC</div>
  <div id="fn"></div>
  <div id="sub"></div>
  <div id="pp" role="button" aria-label="Lecture / pause">▶</div>
  <div id="hint">↑ ↓ changer de radio · → liste</div>
</div>

<div id="menu" class="out">
  <div id="mh"><h1>Radios de Nouvelle-Calédonie</h1><button id="mc" title="Fermer (Échap)">✕</button></div>
  <div id="lst"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const a=$('#a');
/* ---- les radios (flux fournis) ---- */
const list=[
  {id:'rdk',name:'RDK',full:'Radio Djiido',url:'http://radiodjiido.nc:8004/',c:'#c0392b'},
  {id:'rrb',name:'RRB',full:'Radio Rythme Bleu',url:'https://webradio.lagoon.nc/rrb',c:'#2f6fd0'},
  {id:'nc1',name:'NC1',full:'Nouvelle-Calédonie La 1ère',url:'https://nouvelle-caledonie.ice.infomaniak.ch/nouvelle-caledonie-128.mp3',c:'#b8326e'},
  {id:'ocn',name:'OCN',full:'Océane',url:'https://manager11.streamradio.fr:2040/stream',c:'#1f9d8a'},
  {id:'nrj',name:'NRJ',full:'NRJ Nouvelle-Calédonie',url:'https://testradio01.ice.infomaniak.ch/testradio01-192.mp3',c:'#c98a00'}
];
let cur=-1,want=false,tries=0,menuOpen=false;
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ---- liaison Android (APK) : lecteur multimédia sur écran verrouillé ---- */
function bgState(p){try{if(window.NativeBg)NativeBg.state(p,0,0)}catch{}}
function bgMeta(s){try{if(window.NativeBg)NativeBg.meta(s.name,s.full,'tile:'+s.name+':'+s.c)}catch{}}
window.__mc=x=>{if(x==='play'){if(!want)start()}else if(x==='pause'){if(want)halt()}else if(x==='next')go(1);else if(x==='prev')go(-1)};
/* ---- navigateur / PWA : session multimédia du système ---- */
function ms(){
  if(!('mediaSession' in navigator))return;
  const s=list[cur];if(!s)return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({title:s.name,artist:s.full});
    navigator.mediaSession.playbackState=want?'playing':'paused';
    navigator.mediaSession.setActionHandler('play',()=>{if(!want)start()});
    navigator.mediaSession.setActionHandler('pause',()=>{if(want)halt()});
    navigator.mediaSession.setActionHandler('nexttrack',()=>go(1));
    navigator.mediaSession.setActionHandler('previoustrack',()=>go(-1));
  }catch{}
}

/* ---- affichage ---- */
function status(t){$('#sub').textContent=t}
function render(){
  const s=list[cur];
  $('#pp').textContent=want?'❚❚':'▶';
  if(!s){$('#nm').textContent='Radios NC';$('#fn').textContent='';$('#logo').textContent='♪';return}
  $('#nm').textContent=s.name;$('#fn').textContent=s.full;
  const lg=$('#logo');lg.textContent=s.name;lg.style.background=s.c;
  document.querySelectorAll('.st.on').forEach(e=>e.classList.remove('on'));
  const el=$(`.st[data-i="${cur}"]`);if(el)el.classList.add('on');
}
function renderMenu(){
  $('#lst').innerHTML=list.map((s,i)=>`<div class="st" data-i="${i}"><i style="background:${s.c}">${esc(s.name)}</i><div><b>${esc(s.full)}</b><span>${esc(s.name)}</span></div></div>`).join('');
}

/* ---- lecture ---- */
function select(i){
  if(!list.length)return;
  cur=(i+list.length)%list.length;
  LS.set('last',list[cur].id);
  tries=0;render();bgMeta(list[cur]);ms();
  if(want)start();else status('Touche pour écouter');
}
function go(d){select(cur+d)}
function start(){
  const s=list[cur];if(!s)return;
  want=true;render();status('Connexion…');
  a.src=s.url;a.load();                       /* reprend toujours en direct */
  const p=a.play();if(p&&p.catch)p.catch(onFail);
  bgState(true);ms();
}
function halt(){
  want=false;a.pause();a.removeAttribute('src');a.load();
  render();status('En pause');bgState(false);ms();
}
function toggle(){want?halt():start()}
function onFail(){
  if(!want)return;
  const s=list[cur];
  if(tries===0&&/^http:/.test(s.url)){tries=1;a.src=s.url.replace(/^http:/,'https:');a.play().catch(()=>{});return}
  if(tries<3){tries++;status('Reconnexion…');setTimeout(()=>{if(want){a.src=s.url;a.load();a.play().catch(()=>{})}},1500);return}
  want=false;render();status('Flux indisponible');bgState(false);ms();
}
a.addEventListener('playing',()=>{tries=0;const s=list[cur];status('En direct'+(s&&s.kbps?' · '+s.kbps+' kbps':''))});
a.addEventListener('waiting',()=>{if(want)status('Mise en mémoire…')});
a.addEventListener('error',onFail);

/* ---- menu (tiroir à gauche) ---- */
function openMenu(){if(menuOpen)return;menuOpen=true;$('#menu').classList.remove('out');history.pushState({m:1},'');const e=$('.st.on');if(e&&e.scrollIntoView)e.scrollIntoView({block:'center'})}
function closeMenu(){
  if(!menuOpen)return;menuOpen=false;$('#menu').classList.add('out');
  if(history.state&&history.state.m)history.back();
}
addEventListener('popstate',()=>{if(menuOpen){menuOpen=false;$('#menu').classList.add('out')}});
$('#lst').addEventListener('click',e=>{
  const r=e.target.closest('.st');if(!r)return;
  want=true;select(+r.dataset.i);closeMenu();
});
$('#mc').addEventListener('click',closeMenu);

/* ---- gestes : haut = suivante, bas = précédente, droite = liste, tap = lecture/pause ---- */
let sx=0,sy=0,moved=false;
const mn=$('#main');
mn.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;moved=false});
mn.addEventListener('pointerup',e=>{
  const dx=e.clientX-sx,dy=e.clientY-sy,ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax>60&&ax>1.5*ay){moved=true;if(dx>0)openMenu()}
  else if(ay>60&&ay>1.5*ax){moved=true;go(dy<0?1:-1)}
});
mn.addEventListener('click',()=>{if(moved){moved=false;return}toggle()});
let mx=0,my=0;
const mm=$('#menu');
mm.addEventListener('touchstart',e=>{const t=e.changedTouches[0];mx=t.clientX;my=t.clientY},{passive:true});
mm.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-mx,dy=t.clientY-my;if(dx<-70&&Math.abs(dx)>1.5*Math.abs(dy))closeMenu()},{passive:true});
addEventListener('keydown',e=>{
  const k=e.key;
  if(k==='Escape'||k==='ArrowLeft')closeMenu();
  else if(k==='ArrowRight')openMenu();
  else if(k==='m'||k==='M')menuOpen?closeMenu():openMenu();
  else if(menuOpen)return;
  else if(k==='ArrowDown')go(1);
  else if(k==='ArrowUp')go(-1);
  else if(k===' '){e.preventDefault();toggle()}
});

/* ---- démarrage : s'ouvre sur la dernière radio, en pause ---- */
function init(){
  renderMenu();
  const last=LS.get('last'),i=list.findIndex(s=>s.id===last);
  cur=i<0?0:i;render();bgMeta(list[cur]);ms();status('Touche pour écouter');
}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script>
</body>
</html>
